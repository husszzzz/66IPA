name: Check Cinema 66 IPA

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect IPA
        shell: bash
        run: |
          set -e

          IPA="Cinema 66.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA not found: $IPA"
            exit 1
          fi

          echo "=========================================="
          echo "IPA FILE"
          echo "=========================================="
          ls -lh "$IPA"
          file "$IPA"

          rm -rf ipa_check
          mkdir ipa_check

          echo ""
          echo "=========================================="
          echo "IPA ZIP TEST"
          echo "=========================================="

          unzip -t "$IPA"

          echo ""
          echo "=========================================="
          echo "IPA CONTENTS"
          echo "=========================================="

          unzip -l "$IPA"

          echo ""
          echo "=========================================="
          echo "EXTRACTING"
          echo "=========================================="

          unzip -q "$IPA" -d ipa_check

          echo ""
          echo "=========================================="
          echo "PAYLOAD"
          echo "=========================================="

          find ipa_check/Payload -maxdepth 2 -print

          APP=$(find ipa_check/Payload -maxdepth 1 -type d -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found inside Payload."
            exit 1
          fi

          echo ""
          echo "APP:"
          echo "$APP"

          echo ""
          echo "=========================================="
          echo "INFO.PLIST"
          echo "=========================================="

          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist"

          echo ""
          echo "=========================================="
          echo "IMPORTANT VALUES"
          echo "=========================================="

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "Display Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP/Info.plist" || true

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"

          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist"

          echo ""
          echo "=========================================="
          echo "EXECUTABLE"
          echo "=========================================="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP/Info.plist"
          )

          echo "Executable: $EXECUTABLE"

          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo "ERROR: Executable does not exist."
            exit 1
          fi

          file "$APP/$EXECUTABLE"

          echo ""
          echo "=========================================="
          echo "CODE SIGNATURE"
          echo "=========================================="

          codesign -dvvv "$APP" 2>&1 || true

          echo ""
          echo "=========================================="
          echo "VERIFY SIGNATURE"
          echo "=========================================="

          codesign --verify --deep --strict "$APP" 2>&1 || true

          echo ""
          echo "=========================================="
          echo "EMBEDDED PROVISION"
          echo "=========================================="

          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "embedded.mobileprovision FOUND"
          else
            echo "No embedded.mobileprovision"
          fi

          echo ""
          echo "=========================================="
          echo "IPA CHECK FINISHED"
          echo "=========================================="
