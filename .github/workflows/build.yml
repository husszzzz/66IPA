name: Build Unsigned Median IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source Code
        run: |
          tar -xzf ios_source.tar.gz

      - name: Install Dependencies
        run: |
          cd $(dirname $(find . -name "Podfile" | head -1))
          pod install --repo-update

      - name: Build App (Unsigned)
        run: |
          cd $(dirname $(find . -name "*.xcworkspace" | head -1))
          WORKSPACE=$(ls | grep .xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{getline; print $1}')
          
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build_output"

      - name: Create IPA File
        run: |
          cd $(dirname $(find . -name "*.xcworkspace" | head -1))
          mkdir -p Payload
          mv build_output/*.app Payload/
          zip -qr ../hassany_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassany_Unsigned_IPA
          path: hassany_app.ipa
