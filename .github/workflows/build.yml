name: Cinema 66 IPA Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Cinema66-iOS-Source.zip"
      - "ios_source.tar.gz"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Cinema 66 IPA
    runs-on: macos-26

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Select Xcode 26.6
      # ==========================================
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Selecting Xcode 26.6"
          echo "=========================================="

          XCODE_APP="/Applications/Xcode_26.6.app"

          if [ ! -d "$XCODE_APP" ]; then
            echo "ERROR: Xcode 26.6 not found."
            echo ""
            echo "Available Xcode installations:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          sudo xcode-select -s \
            "$XCODE_APP/Contents/Developer"

          echo ""
          echo "Selected Xcode:"
          xcodebuild -version

          echo ""
          echo "Selected developer directory:"
          xcode-select -p

      # ==========================================
      # 3. Check installed SDKs and platforms
      # ==========================================
      - name: Check iOS platform
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Checking iOS platform"
          echo "=========================================="

          echo ""
          echo "Xcode SDKs:"
          xcodebuild -showsdks

          echo ""
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version || true

          echo ""
          echo "Available iOS runtimes/platforms:"
          xcodebuild -downloadPlatform iOS -help 2>/dev/null || true

      # ==========================================
      # 4. Install iOS 26 platform
      # ==========================================
      - name: Install iOS 26 platform
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Installing iOS 26 platform"
          echo "=========================================="

          echo ""
          echo "Downloading iOS platform if required..."

          xcodebuild \
            -downloadPlatform iOS \
            -buildVersion 26.0

          echo ""
          echo "Checking iOS platform after installation..."

          xcodebuild -showsdks | grep -i "iphoneos" || true

          echo ""
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================
      # 5. Inspect repository
      # ==========================================
      - name: Inspect repository
        shell: bash
        run: |
          echo "=========================================="
          echo "Repository contents"
          echo "=========================================="

          find . \
            -maxdepth 4 \
            -not -path "./.git/*" \
            -print \
            | sort

      # ==========================================
      # 6. Locate source archive
      # ==========================================
      - name: Locate source archive
        shell: bash
        run: |
          set -e

          ARCHIVE=""

          if [ -f "Cinema66-iOS-Source.zip" ]; then

            ARCHIVE="Cinema66-iOS-Source.zip"

          elif [ -f "ios_source.tar.gz" ]; then

            ARCHIVE="ios_source.tar.gz"

          else

            ARCHIVE=$(
              find . \
                -maxdepth 2 \
                -type f \
                \( \
                  -iname "*.zip" \
                  -o \
                  -iname "*.tar.gz" \
                  -o \
                  -iname "*.tgz" \
                \) \
                -not -path "./.git/*" \
                | head -n 1
            )

          fi

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No source archive found."
            exit 1
          fi

          echo ""
          echo "Source archive:"
          echo "$ARCHIVE"

          echo "SOURCE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # ==========================================
      # 7. Extract source archive
      # ==========================================
      - name: Extract source archive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Extracting source archive"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/source_extracted"

          mkdir -p "$GITHUB_WORKSPACE/source_extracted"

          case "$SOURCE_ARCHIVE" in

            *.zip)

              echo "ZIP detected."

              unzip -q \
                "$SOURCE_ARCHIVE" \
                -d "$GITHUB_WORKSPACE/source_extracted"

              ;;

            *.tar.gz)

              echo "TAR.GZ detected."

              tar -xzf \
                "$SOURCE_ARCHIVE" \
                -C "$GITHUB_WORKSPACE/source_extracted"

              ;;

            *.tgz)

              echo "TGZ detected."

              tar -xzf \
                "$SOURCE_ARCHIVE" \
                -C "$GITHUB_WORKSPACE/source_extracted"

              ;;

            *)

              echo "ERROR: Unsupported archive format."
              exit 1

              ;;

          esac

          echo ""
          echo "Extracted source:"

          find "$GITHUB_WORKSPACE/source_extracted" \
            -maxdepth 7 \
            -not -path "*/.git/*" \
            -print \
            | sort \
            | head -n 500

      # ==========================================
      # 8. Locate iOS project
      # ==========================================
      - name: Locate iOS project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/source_extracted"

          echo "=========================================="
          echo "Searching for iOS project"
          echo "=========================================="

          # --------------------------------------
          # Workspace first
          # --------------------------------------

          WORKSPACE=$(
            find "$ROOT" \
              -type d \
              -name "*.xcworkspace" \
              -not -path "*/Pods/*" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )

          if [ -n "$WORKSPACE" ]; then

            echo "Found workspace:"
            echo "$WORKSPACE"

            PROJECT_DIR="$(dirname "$WORKSPACE")"

            echo "BUILD_WORKSPACE=$WORKSPACE" \
              >> "$GITHUB_ENV"

            echo "BUILD_PROJECT_DIR=$PROJECT_DIR" \
              >> "$GITHUB_ENV"

            exit 0
          fi

          # --------------------------------------
          # Xcode project
          # --------------------------------------

          PROJECT=$(
            find "$ROOT" \
              -type d \
              -name "*.xcodeproj" \
              -not -path "*/Pods/*" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )

          if [ -n "$PROJECT" ]; then

            echo "Found Xcode project:"
            echo "$PROJECT"

            PROJECT_DIR="$(dirname "$PROJECT")"

            echo "BUILD_PROJECT=$PROJECT" \
              >> "$GITHUB_ENV"

            echo "BUILD_PROJECT_DIR=$PROJECT_DIR" \
              >> "$GITHUB_ENV"

            exit 0
          fi

          # --------------------------------------
          # XcodeGen project.yml
          # --------------------------------------

          PROJECT_YML=$(
            find "$ROOT" \
              -type f \
              -name "project.yml" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )

          if [ -n "$PROJECT_YML" ]; then

            echo "Found project.yml:"
            echo "$PROJECT_YML"

            PROJECT_DIR="$(dirname "$PROJECT_YML")"

            echo "BUILD_PROJECT_DIR=$PROJECT_DIR" \
              >> "$GITHUB_ENV"

            echo "BUILD_PROJECT_YML=$PROJECT_YML" \
              >> "$GITHUB_ENV"

            exit 0
          fi

          echo ""
          echo "ERROR: No iOS project found."

          echo "Expected:"
          echo "*.xcworkspace"
          echo "*.xcodeproj"
          echo "project.yml"

          exit 1

      # ==========================================
      # 9. Install XcodeGen
      # ==========================================
      - name: Install XcodeGen
        if: env.BUILD_PROJECT_YML != ''
        shell: bash
        run: |
          set -e

          echo "Installing XcodeGen..."

          brew install xcodegen

          echo ""
          xcodegen --version

      # ==========================================
      # 10. Generate Xcode project
      # ==========================================
      - name: Generate Xcode project
        if: env.BUILD_PROJECT_YML != ''
        shell: bash
        working-directory: ${{ env.BUILD_PROJECT_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "Generating Xcode project"
          echo "=========================================="

          xcodegen generate

          echo ""
          echo "Generated projects:"

          find . \
            -maxdepth 4 \
            \( \
              -name "*.xcodeproj" \
              -o \
              -name "*.xcworkspace" \
            \) \
            -print

          PROJECT=$(
            find . \
              -type d \
              -name "*.xcodeproj" \
              | head -n 1 || true
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XcodeGen did not create .xcodeproj"
            exit 1
          fi

          PROJECT="$GITHUB_WORKSPACE/source_extracted/$PROJECT"

          echo ""
          echo "Generated project:"
          echo "$PROJECT"

          echo "BUILD_PROJECT=$PROJECT" \
            >> "$GITHUB_ENV"

      # ==========================================
      # 11. CocoaPods
      # ==========================================
      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -e

          PODFILE=$(
            find "$BUILD_PROJECT_DIR" \
              -maxdepth 3 \
              -name "Podfile" \
              -type f \
              | head -n 1 || true
          )

          if [ -z "$PODFILE" ]; then

            echo "No Podfile found."
            echo "Skipping CocoaPods."

            exit 0

          fi

          echo "Podfile:"
          echo "$PODFILE"

          if ! command -v pod >/dev/null 2>&1; then

            echo "Installing CocoaPods..."

            brew install cocoapods

          fi

          echo ""
          echo "CocoaPods:"
          pod --version

          POD_DIR="$(dirname "$PODFILE")"

          cd "$POD_DIR"

          echo ""
          echo "Installing dependencies..."

          pod install --repo-update

          WORKSPACE=$(
            find "$POD_DIR" \
              -maxdepth 2 \
              -type d \
              -name "*.xcworkspace" \
              | head -n 1 || true
          )

          if [ -n "$WORKSPACE" ]; then

            echo ""
            echo "CocoaPods workspace:"
            echo "$WORKSPACE"

            echo "BUILD_WORKSPACE=$WORKSPACE" \
              >> "$GITHUB_ENV"

          fi

      # ==========================================
      # 12. Inspect project
      # ==========================================
      - name: Inspect Xcode project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Xcode project information"
          echo "=========================================="

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            echo "Workspace:"
            echo "$BUILD_WORKSPACE"

            echo ""
            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -list

          elif [ -n "${BUILD_PROJECT:-}" ] \
            && [ -d "$BUILD_PROJECT" ]; then

            echo "Project:"
            echo "$BUILD_PROJECT"

            echo ""
            xcodebuild \
              -project "$BUILD_PROJECT" \
              -list

          else

            echo "ERROR: No project/workspace found."
            exit 1

          fi

      # ==========================================
      # 13. Detect scheme
      # ==========================================
      - name: Detect build scheme
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Detecting scheme"
          echo "=========================================="

          LIST=""

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            LIST=$(
              xcodebuild \
                -workspace "$BUILD_WORKSPACE" \
                -list 2>/dev/null || true
            )

          else

            LIST=$(
              xcodebuild \
                -project "$BUILD_PROJECT" \
                -list 2>/dev/null || true
            )

          fi

          echo "$LIST"

          SCHEME=""

          if echo "$LIST" | \
            grep -qE '^[[:space:]]*Cinema66[[:space:]]*$'; then

            SCHEME="Cinema66"

          elif echo "$LIST" | \
            grep -qE '^[[:space:]]*Cinema[[:space:]]*$'; then

            SCHEME="Cinema"

          else

            SCHEME=$(
              echo "$LIST" |
              awk '
                /Schemes:/ {
                  found=1
                  next
                }

                found && NF {
                  gsub(/^[ \t]+|[ \t]+$/, "", $0)
                  print
                  exit
                }
              '
            )

          fi

          if [ -z "$SCHEME" ]; then

            echo ""
            echo "ERROR: Could not detect scheme."

            echo "$LIST"

            exit 1

          fi

          echo ""
          echo "Selected scheme:"
          echo "$SCHEME"

          echo "BUILD_SCHEME=$SCHEME" \
            >> "$GITHUB_ENV"

      # ==========================================
      # 14. Check destination BEFORE build
      # ==========================================
      - name: Verify iOS build destination
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Checking iOS destination"
          echo "=========================================="

          DESTINATION="generic/platform=iOS"

          echo "Destination:"
          echo "$DESTINATION"

          echo ""
          echo "Checking project destinations..."

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -scheme "$BUILD_SCHEME" \
              -showdestinations \
              || true

          else

            xcodebuild \
              -project "$BUILD_PROJECT" \
              -scheme "$BUILD_SCHEME" \
              -showdestinations \
              || true

          fi

      # ==========================================
      # 15. Prepare build directory
      # ==========================================
      - name: Prepare build directory
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build_output"
          rm -rf "$GITHUB_WORKSPACE/ipa_output"

          mkdir -p "$GITHUB_WORKSPACE/build_output"
          mkdir -p "$GITHUB_WORKSPACE/ipa_output"

          echo "Build directories ready."

      # ==========================================
      # 16. Build unsigned iOS app
      # ==========================================
      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING CINEMA 66"
          echo "=========================================="

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "Scheme:"
          echo "$BUILD_SCHEME"

          echo ""
          echo "Destination:"
          echo "generic/platform=iOS"

          COMMON_ARGS=(

            "-configuration"
            "Release"

            "-sdk"
            "iphoneos"

            "-destination"
            "generic/platform=iOS"

            "-derivedDataPath"
            "$GITHUB_WORKSPACE/build_output"

            "CODE_SIGNING_ALLOWED=NO"

            "CODE_SIGNING_REQUIRED=NO"

            "CODE_SIGN_IDENTITY="

            "CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO"

            "PROVISIONING_PROFILE_SPECIFIER="

            "DEVELOPMENT_TEAM="

            "ONLY_ACTIVE_ARCH=NO"

          )

          echo ""
          echo "Starting xcodebuild..."

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -scheme "$BUILD_SCHEME" \
              "${COMMON_ARGS[@]}" \
              build

          elif [ -n "${BUILD_PROJECT:-}" ] \
            && [ -d "$BUILD_PROJECT" ]; then

            xcodebuild \
              -project "$BUILD_PROJECT" \
              -scheme "$BUILD_SCHEME" \
              "${COMMON_ARGS[@]}" \
              build

          else

            echo "ERROR: No project or workspace available."
            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

      # ==========================================
      # 17. Locate .app
      # ==========================================
      - name: Locate built app
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Locating .app"
          echo "=========================================="

          APP_PATH=$(
            find "$GITHUB_WORKSPACE/build_output" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              | head -n 1 || true
          )

          if [ -z "$APP_PATH" ]; then

            APP_PATH=$(
              find "$GITHUB_WORKSPACE/build_output" \
                -type d \
                -name "*.app" \
                | head -n 1 || true
            )

          fi

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: No .app found."

            echo ""
            echo "Build output:"

            find "$GITHUB_WORKSPACE/build_output" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1

          fi

          echo ""
          echo "APP:"
          echo "$APP_PATH"

          echo ""
          echo "Bundle information:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PATH/Info.plist" \
            2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" \
            2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist" \
            2>/dev/null || true

          echo "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"

      # ==========================================
      # 18. Package IPA
      # ==========================================
      - name: Package IPA
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Creating Cinema66.ipa"
          echo "=========================================="

          rm -rf \
            "$GITHUB_WORKSPACE/ipa_output/Payload"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_output/Payload"

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa_output/Payload/"

          cd "$GITHUB_WORKSPACE/ipa_output"

          /usr/bin/zip \
            -qry \
            "Cinema66.ipa" \
            "Payload"

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh "Cinema66.ipa"

      # ==========================================
      # 19. Verify IPA
      # ==========================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/ipa_output/Cinema66.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: Cinema66.ipa not found."
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "IPA contents:"

          unzip -l "$IPA" | head -n 100

          echo ""
          echo "IPA verification successful."

      # ==========================================
      # 20. Upload IPA
      # ==========================================
      - name: Upload Cinema 66 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cinema66-IPA
          path: ipa_output/Cinema66.ipa
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 21. Upload diagnostics if build fails
      # ==========================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema66-Build-Diagnostics
          path: |
            build_output/
          if-no-files-found: ignore
          retention-days: 7
