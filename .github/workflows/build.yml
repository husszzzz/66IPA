name: Cinema 66 IPA Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Cinema66-iOS-Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  # عدّل هذا لو تريد Bundle ID مختلف
  DEFAULT_BUNDLE_ID: "com.cinema66.app"

jobs:
  build:
    name: Build Cinema 66
    runs-on: macos-26

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version

          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Find source archive
        shell: bash
        run: |
          set -e

          ARCHIVE=""

          if [ -f "Cinema66-iOS-Source.zip" ]; then
            ARCHIVE="Cinema66-iOS-Source.zip"
          else
            ARCHIVE=$(find . -maxdepth 2 -type f \
              \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) \
              -not -path "./.git/*" | head -n 1)
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Source archive not found."
            exit 1
          fi

          echo "Archive:"
          echo "$ARCHIVE"

          echo "SOURCE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source_extracted
          mkdir -p source_extracted

          case "$SOURCE_ARCHIVE" in
            *.zip)
              unzip -q "$SOURCE_ARCHIVE" -d source_extracted
              ;;
            *.tar.gz)
              tar -xzf "$SOURCE_ARCHIVE" -C source_extracted
              ;;
            *.tgz)
              tar -xzf "$SOURCE_ARCHIVE" -C source_extracted
              ;;
            *)
              echo "ERROR: Unsupported archive."
              exit 1
              ;;
          esac

          echo "Source extracted."

      - name: Find project.yml
        shell: bash
        run: |
          set -e

          PROJECT_YML=$(find "$GITHUB_WORKSPACE/source_extracted" \
            -type f \
            -name "project.yml" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$PROJECT_YML" ]; then
            echo "ERROR: project.yml not found."

            echo "Available files:"
            find "$GITHUB_WORKSPACE/source_extracted" \
              -maxdepth 6 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_YML")

          echo "project.yml:"
          echo "$PROJECT_YML"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "BUILD_PROJECT_YML=$PROJECT_YML" >> "$GITHUB_ENV"
          echo "BUILD_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project.yml
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "project.yml"
          echo "=========================================="

          cat "$BUILD_PROJECT_YML"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        working-directory: ${{ env.BUILD_PROJECT_DIR }}
        run: |
          set -e

          xcodegen generate

          PROJECT=$(find "$BUILD_PROJECT_DIR" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XcodeGen did not create project."
            exit 1
          fi

          echo "Generated project:"
          echo "$PROJECT"

          echo "BUILD_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Pods if needed
        shell: bash
        run: |
          set -e

          PODFILE=$(find "$BUILD_PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            -name "Podfile" \
            | head -n 1 || true)

          if [ -z "$PODFILE" ]; then
            echo "No Podfile."
            exit 0
          fi

          POD_DIR=$(dirname "$PODFILE")

          cd "$POD_DIR"

          pod install --repo-update

          WORKSPACE=$(find "$POD_DIR" \
            -maxdepth 2 \
            -type d \
            -name "*.xcworkspace" \
            | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
            echo "Using workspace:"
            echo "$WORKSPACE"
          fi

      - name: List project
        shell: bash
        run: |
          set -e

          if [ -n "${BUILD_WORKSPACE:-}" ]; then
            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -list
          else
            xcodebuild \
              -project "$BUILD_PROJECT" \
              -list
          fi

      - name: Detect scheme
        shell: bash
        run: |
          set -e

          if [ -n "${BUILD_WORKSPACE:-}" ]; then
            LIST=$(xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -list)
          else
            LIST=$(xcodebuild \
              -project "$BUILD_PROJECT" \
              -list)
          fi

          SCHEME=""

          if echo "$LIST" | grep -qE '^[[:space:]]*Cinema66[[:space:]]*$'; then
            SCHEME="Cinema66"
          elif echo "$LIST" | grep -qE '^[[:space:]]*Cinema[[:space:]]*$'; then
            SCHEME="Cinema"
          else
            SCHEME=$(echo "$LIST" | awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "", $0)
                print
                exit
              }')
          fi

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme not found."
            exit 1
          fi

          echo "Selected scheme:"
          echo "$SCHEME"

          echo "BUILD_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Prepare build
        shell: bash
        run: |
          set -e

          rm -rf build_output
          rm -rf ipa_output

          mkdir -p build_output
          mkdir -p ipa_output

      - name: Build unsigned app
        shell: bash
        run: |
          set -e

          # نفرض Bundle ID مباشرة عبر أمر البناء، بغض النظر
          # عن هل project.yml يحدده أو لا. هذا يحل مشكلة
          # CFBundleIdentifier is empty نهائيًا.
          BUNDLE_ID="${DEFAULT_BUNDLE_ID}"

          echo "Forcing PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID"

          ARGS=(
            "-configuration"
            "Release"

            "-sdk"
            "iphoneos"

            "-destination"
            "generic/platform=iOS"

            "-derivedDataPath"
            "$GITHUB_WORKSPACE/build_output"

            "CODE_SIGNING_ALLOWED=NO"
            "CODE_SIGNING_REQUIRED=NO"
            "CODE_SIGN_IDENTITY="
            "CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO"
            "PROVISIONING_PROFILE_SPECIFIER="
            "DEVELOPMENT_TEAM="
            "ONLY_ACTIVE_ARCH=NO"
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
          )

          if [ -n "${BUILD_WORKSPACE:-}" ]; then

            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -scheme "$BUILD_SCHEME" \
              "${ARGS[@]}" \
              build

          else

            xcodebuild \
              -project "$BUILD_PROJECT" \
              -scheme "$BUILD_SCHEME" \
              "${ARGS[@]}" \
              build

          fi

      - name: Find app
        shell: bash
        run: |
          set -e

          APP=$(find "$GITHUB_WORKSPACE/build_output" \
            -type d \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            | head -n 1 || true)

          if [ -z "$APP" ]; then
            APP=$(find "$GITHUB_WORKSPACE/build_output" \
              -type d \
              -name "*.app" \
              | head -n 1 || true)
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: App not found."
            exit 1
          fi

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

          echo "App:"
          echo "$APP"

      - name: Patch Info.plist if needed
        shell: bash
        run: |
          set -e

          # شبكة أمان إضافية: لو لأي سبب طلع CFBundleIdentifier
          # فاضي أو مفقود رغم الـ override، نصلّحه يدويًا هنا
          # قبل ما توصل لخطوة التحقق.
          PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist missing, cannot patch."
            exit 1
          fi

          CURRENT_ID=$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || true
          )

          if [ -z "$CURRENT_ID" ]; then
            echo "CFBundleIdentifier missing or empty, patching to $DEFAULT_BUNDLE_ID"

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleIdentifier string $DEFAULT_BUNDLE_ID" \
              "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy \
              -c "Set :CFBundleIdentifier $DEFAULT_BUNDLE_ID" \
              "$PLIST"
          else
            echo "CFBundleIdentifier already set: $CURRENT_ID"
          fi

          # نفس الفكرة لـ CFBundleExecutable: لو مفقود،
          # نحدده تلقائيًا من اسم الـ .app نفسه (بدون .app).
          CURRENT_EXEC=$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST" 2>/dev/null || true
          )

          if [ -z "$CURRENT_EXEC" ]; then
            APP_BASENAME=$(basename "$APP_PATH")
            EXEC_NAME="${APP_BASENAME%.app}"

            echo "CFBundleExecutable missing or empty, patching to $EXEC_NAME"

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleExecutable string $EXEC_NAME" \
              "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy \
              -c "Set :CFBundleExecutable $EXEC_NAME" \
              "$PLIST"

            if [ ! -f "$APP_PATH/$EXEC_NAME" ]; then
              echo "WARNING: no file named '$EXEC_NAME' found inside the .app."
              echo "Files actually inside the .app:"
              find "$APP_PATH" -maxdepth 1 -type f -perm +111 -print
            fi
          else
            echo "CFBundleExecutable already set: $CURRENT_EXEC"
          fi

      - name: Verify Info.plist
        shell: bash
        run: |
          set -e

          PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist missing."
            exit 1
          fi

          echo "Bundle ID:"

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$PLIST"
          )

          echo "$BUNDLE_ID"

          if [ -z "$BUNDLE_ID" ]; then
            echo "ERROR: CFBundleIdentifier is empty."
            exit 1
          fi

          echo ""
          echo "Executable:"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$PLIST"
          )

          echo "$EXECUTABLE"

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Executable missing."
            exit 1
          fi

          echo ""
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST" || true

          echo ""
          echo "Build:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST" || true

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf ipa_output/Payload

          mkdir -p ipa_output/Payload

          cp -R \
            "$APP_PATH" \
            ipa_output/Payload/

          cd ipa_output

          zip -qry \
            "Cinema66.ipa" \
            "Payload"

          echo ""
          echo "IPA created:"
          ls -lh Cinema66.ipa

      - name: Final IPA verification
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/ipa_output/Cinema66.ipa"

          echo "=========================================="
          echo "FINAL IPA CHECK"
          echo "=========================================="

          file "$IPA"

          unzip -t "$IPA"

          rm -rf "$GITHUB_WORKSPACE/final_check"

          mkdir "$GITHUB_WORKSPACE/final_check"

          unzip -q \
            "$IPA" \
            -d "$GITHUB_WORKSPACE/final_check"

          APP=$(find "$GITHUB_WORKSPACE/final_check/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: Payload does not contain .app"
            exit 1
          fi

          echo ""
          echo "Final app:"
          echo "$APP"

          echo ""
          echo "Final Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo ""
          echo "Final executable:"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP/Info.plist"
          )

          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo "ERROR: Final executable missing."
            exit 1
          fi

          echo "$EXECUTABLE"

          echo ""
          echo "IPA verification successful."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cinema66-IPA
          path: ipa_output/Cinema66.ipa
          if-no-files-found: error
          retention-days: 30
