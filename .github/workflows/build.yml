name: Cinema 66 IPA Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Cinema66-iOS-Source.zip"
      - "Cinema 66.ipa"
      - "ios_source.tar.gz"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Cinema 66 IPA
    runs-on: macos-26

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # XCODE 26.6
      # =========================================================

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e

          XCODE_APP="/Applications/Xcode_26.6.app"

          if [ ! -d "$XCODE_APP" ]; then
            echo "ERROR: Xcode 26.6 not found."
            echo ""
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          sudo xcode-select -s \
            "$XCODE_APP/Contents/Developer"

          echo ""
          echo "=========================================="
          echo "XCODE VERSION"
          echo "=========================================="

          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p


      # =========================================================
      # IOS SDK
      # =========================================================

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "IOS SDK"
          echo "=========================================="

          xcodebuild -showsdks

          echo ""
          echo "Current iPhoneOS SDK:"

          SDK_VERSION=$(
            xcrun --sdk iphoneos --show-sdk-version
          )

          echo "$SDK_VERSION"

          if [ "$SDK_VERSION" != "26.5" ]; then
            echo ""
            echo "WARNING:"
            echo "Expected iOS SDK 26.5."
            echo "Found: $SDK_VERSION"
            echo ""
            echo "Continuing with installed SDK."
          fi


      # =========================================================
      # INSPECT REPOSITORY
      # =========================================================

      - name: Inspect repository
        shell: bash
        run: |
          echo "=========================================="
          echo "REPOSITORY CONTENTS"
          echo "=========================================="

          find . \
            -maxdepth 4 \
            -not -path "./.git/*" \
            -print \
            | sort


      # =========================================================
      # LOCATE SOURCE ARCHIVE
      # =========================================================

      - name: Locate source archive
        shell: bash
        run: |
          set -e

          ARCHIVE=""

          if [ -f "Cinema66-iOS-Source.zip" ]; then

            ARCHIVE="Cinema66-iOS-Source.zip"

          elif [ -f "ios_source.tar.gz" ]; then

            ARCHIVE="ios_source.tar.gz"

          else

            ARCHIVE=$(
              find . \
                -maxdepth 2 \
                -type f \
                \( \
                  -iname "*.zip" \
                  -o \
                  -iname "*.tar.gz" \
                  -o \
                  -iname "*.tgz" \
                \) \
                -not -path "./.git/*" \
                | head -n 1
            )

          fi

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No source archive found."
            exit 1
          fi

          echo ""
          echo "Source archive:"
          echo "$ARCHIVE"

          echo "SOURCE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"


      # =========================================================
      # EXTRACT SOURCE
      # =========================================================

      - name: Extract source archive
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING SOURCE"
          echo "=========================================="

          rm -rf \
            "$GITHUB_WORKSPACE/source_extracted"

          mkdir -p \
            "$GITHUB_WORKSPACE/source_extracted"

          case "$SOURCE_ARCHIVE" in

            *.zip)

              echo "ZIP detected."

              unzip -q \
                "$SOURCE_ARCHIVE" \
                -d "$GITHUB_WORKSPACE/source_extracted"

              ;;

            *.tar.gz)

              echo "TAR.GZ detected."

              tar -xzf \
                "$SOURCE_ARCHIVE" \
                -C "$GITHUB_WORKSPACE/source_extracted"

              ;;

            *.tgz)

              echo "TGZ detected."

              tar -xzf \
                "$SOURCE_ARCHIVE" \
                -C "$GITHUB_WORKSPACE/source_extracted"

              ;;

            *)

              echo "ERROR: Unsupported archive format."
              exit 1

              ;;

          esac

          echo ""
          echo "Extracted files:"

          find "$GITHUB_WORKSPACE/source_extracted" \
            -maxdepth 7 \
            -not -path "*/.git/*" \
            -print \
            | sort \
            | head -n 500


      # =========================================================
      # LOCATE IOS PROJECT
      # =========================================================

      - name: Locate iOS project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/source_extracted"

          echo "=========================================="
          echo "SEARCHING FOR IOS PROJECT"
          echo "=========================================="

          WORKSPACE=$(
            find "$ROOT" \
              -type d \
              -name "*.xcworkspace" \
              -not -path "*/Pods/*" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )

          if [ -n "$WORKSPACE" ]; then

            echo "Found workspace:"
            echo "$WORKSPACE"

            PROJECT_DIR="$(dirname "$WORKSPACE")"

            echo "BUILD_WORKSPACE=$WORKSPACE" \
              >> "$GITHUB_ENV"

            echo "BUILD_PROJECT_DIR=$PROJECT_DIR" \
              >> "$GITHUB_ENV"

            exit 0

          fi


          PROJECT=$(
            find "$ROOT" \
              -type d \
              -name "*.xcodeproj" \
              -not -path "*/Pods/*" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )

          if [ -n "$PROJECT" ]; then

            echo "Found Xcode project:"
            echo "$PROJECT"

            PROJECT_DIR="$(dirname "$PROJECT")"

            echo "BUILD_PROJECT=$PROJECT" \
              >> "$GITHUB_ENV"

            echo "BUILD_PROJECT_DIR=$PROJECT_DIR" \
              >> "$GITHUB_ENV"

            exit 0

          fi


          PROJECT_YML=$(
            find "$ROOT" \
              -type f \
              -name "project.yml" \
              -not -path "*/.git/*" \
              | head -n 1 || true
          )

          if [ -n "$PROJECT_YML" ]; then

            echo "Found project.yml:"
            echo "$PROJECT_YML"

            PROJECT_DIR="$(dirname "$PROJECT_YML")"

            echo "BUILD_PROJECT_DIR=$PROJECT_DIR" \
              >> "$GITHUB_ENV"

            echo "BUILD_PROJECT_YML=$PROJECT_YML" \
              >> "$GITHUB_ENV"

            exit 0

          fi


          echo ""
          echo "ERROR: No iOS project found."

          echo "Expected:"
          echo "*.xcworkspace"
          echo "*.xcodeproj"
          echo "project.yml"

          exit 1


      # =========================================================
      # XCODEGEN
      # =========================================================

      - name: Install XcodeGen
        if: env.BUILD_PROJECT_YML != ''
        shell: bash
        run: |
          set -e

          echo "Installing XcodeGen..."

          brew install xcodegen

          echo ""
          xcodegen --version


      # =========================================================
      # GENERATE XCODE PROJECT
      # =========================================================

      - name: Generate Xcode project
        if: env.BUILD_PROJECT_YML != ''
        shell: bash
        working-directory: ${{ env.BUILD_PROJECT_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "GENERATING XCODE PROJECT"
          echo "=========================================="

          xcodegen generate

          PROJECT=$(
            find . \
              -type d \
              -name "*.xcodeproj" \
              | head -n 1 || true
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XcodeGen did not create .xcodeproj"
            exit 1
          fi

          PROJECT="$GITHUB_WORKSPACE/source_extracted/$PROJECT"

          echo ""
          echo "Generated project:"
          echo "$PROJECT"

          echo "BUILD_PROJECT=$PROJECT" \
            >> "$GITHUB_ENV"


      # =========================================================
      # COCOAPODS
      # =========================================================

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -e

          PODFILE=$(
            find "$BUILD_PROJECT_DIR" \
              -maxdepth 3 \
              -name "Podfile" \
              -type f \
              | head -n 1 || true
          )

          if [ -z "$PODFILE" ]; then
            echo "No Podfile found."
            echo "Skipping CocoaPods."
            exit 0
          fi

          echo "Podfile:"
          echo "$PODFILE"

          if ! command -v pod >/dev/null 2>&1; then
            echo "Installing CocoaPods..."
            brew install cocoapods
          fi

          echo ""
          echo "CocoaPods version:"
          pod --version

          POD_DIR="$(dirname "$PODFILE")"

          cd "$POD_DIR"

          echo ""
          echo "Installing Pods..."

          pod install --repo-update

          WORKSPACE=$(
            find "$POD_DIR" \
              -maxdepth 2 \
              -type d \
              -name "*.xcworkspace" \
              | head -n 1 || true
          )

          if [ -n "$WORKSPACE" ]; then

            echo ""
            echo "Using CocoaPods workspace:"
            echo "$WORKSPACE"

            echo "BUILD_WORKSPACE=$WORKSPACE" \
              >> "$GITHUB_ENV"

          fi


      # =========================================================
      # INSPECT XCODE PROJECT
      # =========================================================

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "XCODE PROJECT INFORMATION"
          echo "=========================================="

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            echo "Workspace:"
            echo "$BUILD_WORKSPACE"

            echo ""

            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -list

          elif [ -n "${BUILD_PROJECT:-}" ] \
            && [ -d "$BUILD_PROJECT" ]; then

            echo "Project:"
            echo "$BUILD_PROJECT"

            echo ""

            xcodebuild \
              -project "$BUILD_PROJECT" \
              -list

          else

            echo "ERROR: No project/workspace found."
            exit 1

          fi


      # =========================================================
      # DETECT SCHEME
      # =========================================================

      - name: Detect build scheme
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DETECTING BUILD SCHEME"
          echo "=========================================="

          LIST=""

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            LIST=$(
              xcodebuild \
                -workspace "$BUILD_WORKSPACE" \
                -list 2>/dev/null || true
            )

          else

            LIST=$(
              xcodebuild \
                -project "$BUILD_PROJECT" \
                -list 2>/dev/null || true
            )

          fi

          echo "$LIST"

          SCHEME=""

          if echo "$LIST" | \
            grep -qE '^[[:space:]]*Cinema66[[:space:]]*$'; then

            SCHEME="Cinema66"

          elif echo "$LIST" | \
            grep -qE '^[[:space:]]*Cinema[[:space:]]*$'; then

            SCHEME="Cinema"

          else

            SCHEME=$(
              echo "$LIST" |
              awk '
                /Schemes:/ {
                  found=1
                  next
                }

                found && NF {
                  gsub(/^[ \t]+|[ \t]+$/, "", $0)
                  print
                  exit
                }
              '
            )

          fi

          if [ -z "$SCHEME" ]; then

            echo "ERROR: Could not detect scheme."
            exit 1

          fi

          echo ""
          echo "Selected scheme:"
          echo "$SCHEME"

          echo "BUILD_SCHEME=$SCHEME" \
            >> "$GITHUB_ENV"


      # =========================================================
      # DESTINATIONS
      # =========================================================

      - name: Show available destinations
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "AVAILABLE DESTINATIONS"
          echo "=========================================="

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -scheme "$BUILD_SCHEME" \
              -showdestinations || true

          else

            xcodebuild \
              -project "$BUILD_PROJECT" \
              -scheme "$BUILD_SCHEME" \
              -showdestinations || true

          fi


      # =========================================================
      # PREPARE DIRECTORIES
      # =========================================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -e

          rm -rf \
            "$GITHUB_WORKSPACE/build_output"

          rm -rf \
            "$GITHUB_WORKSPACE/ipa_output"

          rm -rf \
            "$GITHUB_WORKSPACE/ipa_inspection"

          mkdir -p \
            "$GITHUB_WORKSPACE/build_output"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_output"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_inspection"


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING CINEMA 66"
          echo "=========================================="

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "Scheme:"
          echo "$BUILD_SCHEME"

          echo ""
          echo "Destination:"
          echo "generic/platform=iOS"

          COMMON_ARGS=(

            "-configuration"
            "Release"

            "-sdk"
            "iphoneos"

            "-destination"
            "generic/platform=iOS"

            "-derivedDataPath"
            "$GITHUB_WORKSPACE/build_output"

            "CODE_SIGNING_ALLOWED=NO"

            "CODE_SIGNING_REQUIRED=NO"

            "CODE_SIGN_IDENTITY="

            "CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO"

            "PROVISIONING_PROFILE_SPECIFIER="

            "DEVELOPMENT_TEAM="

            "ONLY_ACTIVE_ARCH=NO"

          )

          echo ""
          echo "Starting xcodebuild..."

          if [ -n "${BUILD_WORKSPACE:-}" ] \
            && [ -d "$BUILD_WORKSPACE" ]; then

            xcodebuild \
              -workspace "$BUILD_WORKSPACE" \
              -scheme "$BUILD_SCHEME" \
              "${COMMON_ARGS[@]}" \
              build

          elif [ -n "${BUILD_PROJECT:-}" ] \
            && [ -d "$BUILD_PROJECT" ]; then

            xcodebuild \
              -project "$BUILD_PROJECT" \
              -scheme "$BUILD_SCHEME" \
              "${COMMON_ARGS[@]}" \
              build

          else

            echo "ERROR: No project or workspace available."
            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="


      # =========================================================
      # LOCATE APP
      # =========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCATING BUILT APP"
          echo "=========================================="

          APP_PATH=$(
            find "$GITHUB_WORKSPACE/build_output" \
              -type d \
              -path "*/Build/Products/Release-iphoneos/*.app" \
              | head -n 1 || true
          )

          if [ -z "$APP_PATH" ]; then

            APP_PATH=$(
              find "$GITHUB_WORKSPACE/build_output" \
                -type d \
                -name "*.app" \
                | head -n 1 || true
            )

          fi

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: No .app was produced."

            echo ""
            echo "Build output:"

            find "$GITHUB_WORKSPACE/build_output" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1

          fi

          echo ""
          echo "Built app:"
          echo "$APP_PATH"

          echo ""
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" \
            2>/dev/null || true

          echo ""
          echo "Display Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PATH/Info.plist" \
            2>/dev/null || true

          echo ""
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist" \
            2>/dev/null || true

          echo "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"


      # =========================================================
      # PACKAGE IPA
      # =========================================================

      - name: Package IPA
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING CINEMA66.IPA"
          echo "=========================================="

          rm -rf \
            "$GITHUB_WORKSPACE/ipa_output/Payload"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa_output/Payload"

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa_output/Payload/"

          cd "$GITHUB_WORKSPACE/ipa_output"

          /usr/bin/zip \
            -qry \
            "Cinema66.ipa" \
            "Payload"

          echo ""
          echo "IPA created:"

          ls -lh Cinema66.ipa


      # =========================================================
      # BASIC IPA VERIFICATION
      # =========================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/ipa_output/Cinema66.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: Cinema66.ipa not found."
            exit 1
          fi

          echo "=========================================="
          echo "IPA VERIFICATION"
          echo "=========================================="

          ls -lh "$IPA"

          echo ""
          echo "IPA file type:"

          file "$IPA"

          echo ""
          echo "Testing ZIP:"

          unzip -t "$IPA"

          echo ""
          echo "IPA contents:"

          unzip -l "$IPA" | head -n 200

          echo ""
          echo "IPA verification successful."


      # =========================================================
      # DETAILED IPA DIAGNOSTIC
      # =========================================================

      - name: Inspect IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/ipa_output/Cinema66.ipa"
          INSPECT="$GITHUB_WORKSPACE/ipa_inspection"

          echo "=========================================="
          echo "IPA DIAGNOSTIC CHECK"
          echo "=========================================="

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA not found."
            exit 1
          fi

          echo ""
          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "File type:"
          file "$IPA"


          # -------------------------------------------------------
          # EXTRACT
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "EXTRACTING IPA"
          echo "=========================================="

          rm -rf "$INSPECT"

          mkdir -p "$INSPECT"

          unzip -q \
            "$IPA" \
            -d "$INSPECT"


          # -------------------------------------------------------
          # PAYLOAD
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "PAYLOAD CHECK"
          echo "=========================================="

          if [ ! -d "$INSPECT/Payload" ]; then
            echo "ERROR: Payload directory missing."
            exit 1
          fi

          find "$INSPECT/Payload" \
            -maxdepth 2 \
            -print


          # -------------------------------------------------------
          # APP
          # -------------------------------------------------------

          APP=$(
            find "$INSPECT/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              | head -n 1
          )

          if [ -z "$APP" ]; then
            echo ""
            echo "ERROR: No .app found inside Payload."
            exit 1
          fi

          echo ""
          echo "App:"
          echo "$APP"


          # -------------------------------------------------------
          # INFO PLIST
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "INFO.PLIST"
          echo "=========================================="

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist missing."
            exit 1
          fi

          echo "Info.plist exists."

          echo ""
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"


          echo ""
          echo "Display Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP/Info.plist" \
            || true


          echo ""
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"


          echo ""
          echo "Build:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist"


          # -------------------------------------------------------
          # EXECUTABLE
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "EXECUTABLE CHECK"
          echo "=========================================="

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP/Info.plist"
          )

          echo "Executable:"
          echo "$EXECUTABLE"

          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo ""
            echo "ERROR: Executable does not exist."

            echo "Expected:"
            echo "$APP/$EXECUTABLE"

            exit 1
          fi

          echo ""
          echo "Executable exists."

          echo ""
          file "$APP/$EXECUTABLE"


          # -------------------------------------------------------
          # ARCHITECTURE
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "BINARY ARCHITECTURE"
          echo "=========================================="

          lipo \
            -info \
            "$APP/$EXECUTABLE" \
            2>&1 || true


          # -------------------------------------------------------
          # CODE SIGNATURE
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "CODE SIGNATURE"
          echo "=========================================="

          codesign \
            -dvvv \
            "$APP" \
            2>&1 || true


          # -------------------------------------------------------
          # SIGNATURE VERIFICATION
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "CODE SIGNATURE VERIFICATION"
          echo "=========================================="

          codesign \
            --verify \
            --deep \
            --strict \
            "$APP" \
            2>&1 || true


          # -------------------------------------------------------
          # MOBILEPROVISION
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "MOBILEPROVISION"
          echo "=========================================="

          if [ -f "$APP/embedded.mobileprovision" ]; then

            echo "embedded.mobileprovision: FOUND"

          else

            echo "embedded.mobileprovision: NOT FOUND"

          fi


          # -------------------------------------------------------
          # ENTITLEMENTS
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ENTITLEMENTS"
          echo "=========================================="

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>&1 || true


          # -------------------------------------------------------
          # APP CONTENTS
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "APP CONTENTS"
          echo "=========================================="

          find "$APP" \
            -maxdepth 2 \
            -print \
            | sort \
            | head -n 300


          # -------------------------------------------------------
          # FINAL
          # -------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "IPA DIAGNOSTIC FINISHED"
          echo "=========================================="

          echo ""
          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "App:"
          echo "$APP"

          echo ""
          echo "If the signing application rejects this IPA,"
          echo "send the output of this step."


      # =========================================================
      # UPLOAD IPA
      # =========================================================

      - name: Upload Cinema 66 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cinema66-IPA
          path: ipa_output/Cinema66.ipa
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # UPLOAD DIAGNOSTICS
      # =========================================================

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema66-Build-Diagnostics
          path: |
            build_output/
            ipa_inspection/
            ipa_output/
          if-no-files-found: ignore
          retention-days: 7
